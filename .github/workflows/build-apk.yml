name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          if ! command -v sdkmanager >/dev/null 2>&1; then
            export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin"
          fi
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Scaffold Android project
        run: |
          echo "=== Files in repo ==="
          ls -la
          HTML_FILE=./index.html
          if [ ! -f "$HTML_FILE" ]; then
            echo "ERROR: index.html was not found in the repository root."
            echo "Upload index.html to the repository root first (Add file > Upload files), then re-run this workflow."
            exit 1
          fi
          echo "Using $HTML_FILE as the app page."
          if ! grep -q 'id="rock-news-app"' "$HTML_FILE"; then
            echo "ERROR: $HTML_FILE is not the rock news app file (rock-news-app marker missing)."
            echo "Upload the rock news index.html to the repository root, then re-run this workflow."
            exit 1
          fi

          mkdir -p app/src/main/java/com/rocknews/app app/src/main/assets/www

          cp "$HTML_FILE" app/src/main/assets/www/index.html

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "RockNewsApp"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.rocknews.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.rocknews.app'
                  minSdk 24
                  targetSdk 34
                  versionCode 5
                  versionName '1.0.4'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="Rock News"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name="com.rocknews.app.MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/rocknews/app/MainActivity.java <<'EOF'
          package com.rocknews.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.speech.tts.TextToSpeech;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import java.util.Locale;

          public class MainActivity extends Activity {
              private WebView webView;
              private TextToSpeech tts;
              private boolean ttsReady = false;
              private String pendingTts = null;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.getSettings().setAllowFileAccess(true);
                  webView.getSettings().setAllowFileAccessFromFileURLs(true);
                  webView.getSettings().setAllowUniversalAccessFromFileURLs(true);
                  webView.getSettings().setSupportMultipleWindows(true);
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, android.webkit.WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          if (isMusicLink(url)) { openMusicLink(url); return true; }
                          return false;
                      }
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          if (isMusicLink(url)) { openMusicLink(url); return true; }
                          return false;
                      }
                  });
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onCreateWindow(WebView view, boolean isDialog, boolean isUserGesture, android.os.Message resultMsg) {
                          WebView.WebViewTransport transport = (WebView.WebViewTransport) resultMsg.obj;
                          WebView popup = new WebView(view.getContext());
                          popup.setWebViewClient(new WebViewClient() {
                              @Override
                              public boolean shouldOverrideUrlLoading(WebView v, android.webkit.WebResourceRequest request) {
                                  openMusicLink(request.getUrl().toString());
                                  v.stopLoading();
                                  return true;
                              }
                          });
                          transport.setWebView(popup);
                          resultMsg.sendToTarget();
                          return true;
                      }
                  });
                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void setItem(String key, String value) {
                          try {
                              getSharedPreferences("rock_news_app", MODE_PRIVATE).edit().putString(key, value).commit();
                          } catch (Exception ignored) {}
                      }
                      @JavascriptInterface
                      public String getItem(String key) {
                          try {
                              return getSharedPreferences("rock_news_app", MODE_PRIVATE).getString(key, null);
                          } catch (Exception e) {
                              return null;
                          }
                      }
                      @JavascriptInterface
                      public void removeItem(String key) {
                          try {
                              getSharedPreferences("rock_news_app", MODE_PRIVATE).edit().remove(key).commit();
                          } catch (Exception ignored) {}
                      }
                      @JavascriptInterface
                      public void openLink(String url) {
                          openMusicLink(url);
                      }
                  }, "LynxosStore");
                  tts = new TextToSpeech(this, new TextToSpeech.OnInitListener() {
                      @Override
                      public void onInit(int status) {
                          if (status == TextToSpeech.SUCCESS) {
                              try {
                                  int result = tts.setLanguage(Locale.US);
                                  ttsReady = result != TextToSpeech.LANG_MISSING_DATA && result != TextToSpeech.LANG_NOT_SUPPORTED;
                              } catch (Exception e) {
                                  ttsReady = false;
                              }
                              if (ttsReady && pendingTts != null) {
                                  String text = pendingTts;
                                  pendingTts = null;
                                  try {
                                      tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, "rock-news-reader");
                                  } catch (Exception ignored) {}
                              }
                          }
                      }
                  });
                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void speak(String text) {
                          if (text == null) return;
                          if (ttsReady && tts != null) {
                              try {
                                  tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, "rock-news-reader");
                              } catch (Exception ignored) {}
                          } else {
                              pendingTts = text;
                          }
                      }
                      @JavascriptInterface
                      public void stop() {
                          pendingTts = null;
                          try {
                              if (tts != null) tts.stop();
                          } catch (Exception ignored) {}
                      }
                      @JavascriptInterface
                      public void cancel() {
                          stop();
                      }
                  }, "LynxosTts");
                  if (savedInstanceState != null) {
                      webView.restoreState(savedInstanceState);
                  } else {
                      webView.loadUrl("file:///android_asset/www/index.html");
                  }
                  setContentView(webView);
              }

              // Open music links in the native app (Spotify / YouTube Music / Amazon Music) instead of the WebView
              private boolean isMusicLink(String url) {
                  return url != null && (url.contains("open.spotify.com") || url.contains("music.youtube.com") || url.contains("music.amazon.com"));
              }

              private void openMusicLink(String url) {
                  try {
                      android.content.Intent i = new android.content.Intent(android.content.Intent.ACTION_VIEW, android.net.Uri.parse(url));
                      String pkg = null;
                      if (url.contains("open.spotify.com")) pkg = "com.spotify.music";
                      else if (url.contains("music.youtube.com")) pkg = "com.google.android.apps.youtube.music";
                      else if (url.contains("music.amazon.com")) pkg = "com.amazon.mp3";
                      if (pkg != null) {
                          i.setPackage(pkg);
                          if (i.resolveActivity(getPackageManager()) == null) i.setPackage(null);
                      }
                      startActivity(i);
                  } catch (Exception ignored) {}
              }

              @Override
              protected void onDestroy() {
                  if (tts != null) {
                      try {
                          tts.stop();
                          tts.shutdown();
                      } catch (Exception ignored) {}
                      tts = null;
                  }
                  super.onDestroy();
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  if (webView != null) {
                      webView.saveState(outState);
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rock-news-app-apk
          path: app/build/outputs/apk/debug/app-debug.apk
